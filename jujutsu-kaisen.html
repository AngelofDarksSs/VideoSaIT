<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu Kaisen - Vizionare</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            text-align: center;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            font-size: 24px;
        }
        .container {
            padding: 20px;
        }
        .video-player {
            position: relative;
            width: 80%;
            max-width: 800px;
            margin: auto;
        }
        video {
            width: 100%;
            border-radius: 10px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #ff6347;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #1f1f1f;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>Jujutsu Kaisen - Episodul 1</header>
    <div class="container">
        <div class="video-player">
            <video id="video" controls>
                <source src="video_2025-02-14_12-58-07.mp4" type="video/mp4">
                Browserul tău nu suportă elementul video.
            </video>
        </div>
    </div>
    <footer>
        <a href="index.html" style="color: white; text-decoration: none;">Înapoi la pagina principală</a>
    </footer>
</body>
</html>
