<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling</title>
    <link rel="stylesheet" href="../CSS/stylelinksololeveling.css">
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .video-player {
            position: relative;
            width: 90vw;
            max-width: 800px;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.5);
        }
        .video-player iframe {
            width: 100%;
            height: 450px;
            border-radius: 10px;
        }
        .episode-selector {
            margin-top: 15px;
            padding: 10px;
            background: #303030;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
        }
        .episode-selector label {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }
        .episode-selector select {
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            background: #202020;
            color: white;
        }
    </style>
</head>
<body>
    <header>Solo Leveling</header>

    <main class="container">
        <!-- Player video -->
        <section class="video-player">
            <iframe 
                id="video-frame"
                width="640" 
                height="384" 
                src="https://video.sibnet.ru/shell.php?videoid=5397246" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen>
            </iframe>
        </section>
        
        <!-- Meniu pentru selectarea episodului -->
        <div class="episode-selector">
            <label for="episode">Alege episodul:</label>
            <select id="episode" onchange="changeEpisode()">
                <option value="5397246">Episodul 1</option>
                <option value="5398219">Episodul 2</option>
                <option value="5406977">Episodul 3</option>
                <option value="5415093">Episodul 4</option>
            </select>
        </div>
    </main>

    <footer>
        <a href="../index.html">Înapoi la pagina principală</a>
    </footer>

    <script>
        function changeEpisode() {
            var episodeId = document.getElementById("episode").value;
            var videoFrame = document.getElementById("video-frame");
            videoFrame.src = "https://video.sibnet.ru/shell.php?videoid=" + episodeId;
        }
    </script>
</body>
</html>
