<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling</title>
    <link rel="stylesheet" href="../CSS/stylelinksololeveling.css">
</head>
<body>
    <div id="particles-js"></div>  <!-- Container pentru Particles.js -->
    <header>
        <span>Solo Leveling</span>
        <label class="switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider round"></span>
        </label>
    </header>

    <main class="container">
        <section class="video-player">
            <iframe 
                id="video-frame"
                width="640" 
                height="384" 
                src="https://video.sibnet.ru/shell.php?videoid=5397246" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen>
            </iframe>
        </section>
        
        <div class="episode-selector">
            <label for="episode">Alege episodul:</label>
            <select id="episode">
                <option value="5397246">Episodul 1</option>
                <option value="5398219">Episodul 2</option>
                <option value="5406977">Episodul 3</option>
                <option value="5415093">Episodul 4</option>
                <option value="5421630">Episodul 5</option>
                <option value="5428548">Episodul 6</option>
                <option value="5470909">Episodul 10</option>
            </select>
        </div>
    </main>

    <footer>
        <a href="../index.html">Înapoi la pagina principală</a>
    </footer>

    <!-- Import Particles.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="../JS/particles-config.js"></script>
    <script src="../JS/Video1.js"></script>
</body>
</html>
