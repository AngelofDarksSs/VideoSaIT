<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu Kaisen</title>
    <link rel="stylesheet" href="../CSS/stylelinkjujutsukaisen.css">
</head>
<body>
    <header>
        <span>Jujutsu Kaisen</span>
        <!-- Switch pentru Dark/Light Mode -->
        <label class="switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider round"></span>
        </label>
    </header>

    <main class="container">
        <!-- Player video -->
        <section class="video-player">
            <iframe 
                id="video-frame"
                width="640" 
                height="384" 
                src="https://video.sibnet.ru/shell.php?videoid=4273242" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen>
            </iframe>
        </section>
        
        <!-- Meniu pentru selectarea episodului -->
        <div class="episode-selector">
            <label for="episode">Alege episodul:</label>
            <select id="episode">
                <option value="4273242">Episodul 14</option>
                <option value="4273247">Episodul 15</option>
                <option value="4273253">Episodul 16</option>
                <option value="4273259">Episodul 17</option>
            </select>
        </div>
    </main>

    <footer>
        <a href="../index.html">Înapoi la pagina principală</a>
    </footer>

    <script src="../JS/Video.js"></script>
</body>
</html>
